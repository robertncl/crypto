version: 2
updates:
  # Go modules (backend service).
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns: ["*"]

  # npm packages (web SPA).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns: ["*"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action/init writes a config file stamped with its own version and
      # codeql-action/analyze refuses to read a config from a different version
      # ("Loaded a configuration file for version X, but running version Y").
      # init, analyze and upload-sarif must always bump together.
      codeql-action:
        patterns: ["github/codeql-action*"]
      github-actions:
        patterns: ["*"]

  # Base images referenced by the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
