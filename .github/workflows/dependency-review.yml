name: Dependency Review

# Blocks PRs that introduce dependencies with known vulnerabilities or
# disallowed licenses, and posts a summary comment on the PR.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write # for the summary comment

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
